[build]
command = "npm run build"
publish = ".next"
[build.environment]
NODE_VERSION = "24"
[[plugins]]
package = "@netlify/plugin-nextjs"
[[edge_functions]]
path = "/api/geo"
function = "geo"
[context.deploy-preview.environment]
NEXT_PUBLIC_ENABLE_STREAMING = "false"
NEXT_PUBLIC_ENABLE_RESEARCH = "false"
NEXT_PUBLIC_ENABLE_TELEMETRY = "false"

[context.production.environment]
ENABLE_DURABLE_DATA = "true"
